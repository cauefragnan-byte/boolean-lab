<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="STOCK IA — estoque inteligente com decisões baseadas em álgebra booleana.">
  <title>STOCK IA — Estoque Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">S</span><img class="flu-logo" src="assets/fluminense-logo.png" alt="Fluminense"><div><strong>STOCK <em>IA</em></strong><small>ESTOQUE INTELIGENTE</small></div></div>
      <button class="close-menu" id="closeMenu" aria-label="Fechar menu">×</button>
      <nav class="nav" aria-label="Navegação principal">
        <p>VISÃO GERAL</p><button class="nav-item active" data-view="dashboard"><span>⌂</span>Dashboard</button><button class="nav-item" data-view="products"><span>▦</span>Produtos</button><button class="nav-item" data-view="movements"><span>↕</span>Movimentações</button>
        <p>INTELIGÊNCIA</p><button class="nav-item" data-view="alerts"><span>◉</span>Alertas <b class="nav-badge" id="navAlertCount">0</b></button><button class="nav-item" data-view="insights"><span>✦</span>Análise Inteligente</button><button class="nav-item" data-view="risk"><span>⌁</span>Análise de Risco</button><button class="nav-item" data-view="graph"><span>⌘</span>Mapa de Dependências</button>
        <p>ÁLGEBRA BOOLEANA</p><button class="nav-item" data-view="rules"><span>∧</span>Regras Booleanas</button><button class="nav-item" data-view="simulator"><span>⌘</span>Simulador</button>
        <p>GERENCIAMENTO</p><button class="nav-item" data-view="settings"><span>⚙</span>Configurações</button>
      </nav>
      <div class="sidebar-foot"><div class="user-avatar">CA</div><div><strong>Cauê</strong><small>Administrador</small></div><button id="quickTheme" title="Alternar modo Fluminense" aria-label="Alternar modo Fluminense">☼</button></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main-content">
      <header class="topbar"><button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button><div class="breadcrumbs"><span>STOCK IA</span><b>/</b><strong id="pageTitle">Dashboard</strong></div><div class="top-actions"><button class="icon-btn" id="headerTheme" title="Alternar modo Fluminense" aria-label="Alternar modo Fluminense">☼</button><button class="profile-chip"><span class="online-dot"></span> Cauê <small>⌄</small></button></div></header>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div class="view-container">
        <section class="view active" id="view-dashboard"></section><section class="view" id="view-products"></section><section class="view" id="view-movements"></section><section class="view" id="view-alerts"></section><section class="view" id="view-insights"></section><section class="view" id="view-risk"></section><section class="view" id="view-graph"></section><section class="view" id="view-rules"></section><section class="view" id="view-simulator"></section><section class="view" id="view-settings"></section>
      </div>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="ai-chat-backdrop" id="aiChatBackdrop" hidden>
    <section class="ai-chat" role="dialog" aria-modal="true" aria-labelledby="aiChatTitle">
      <header class="ai-chat-head"><div><span class="ai-kicker">STOCK IA · CENTRAL DE INTELIGÊNCIA</span><h2 id="aiChatTitle">Perguntar à IA</h2></div><button class="modal-close" data-action="close-ai-chat" aria-label="Fechar conversa">×</button></header>
      <div class="ai-chat-messages" id="aiChatMessages"></div>
      <div class="ai-suggestions" id="aiSuggestions"><button data-ai-question="O que pode faltar?">🔴 O que pode faltar?</button><button data-ai-question="O que está vendendo mais?">📈 O que está vendendo mais?</button><button data-ai-question="O que preciso repor?">📦 O que preciso repor?</button><button data-ai-question="Existem riscos no meu estoque?">⚠️ Existem riscos?</button><button data-ai-question="Tenho produtos parados?">💰 Tenho produtos parados?</button><button data-ai-question="Faça um resumo do estoque">📊 Resumo do estoque</button></div>
      <form class="ai-chat-form" id="aiChatForm"><input id="aiQuestion" autocomplete="off" placeholder="O que você quer saber sobre seu estoque?" aria-label="Pergunta para a IA"><button class="btn primary" type="submit">Enviar</button></form>
      <p class="ai-chat-note">A resposta usa os dados reais do estoque e pode usar a OpenAI quando o backend estiver configurado.</p>
    </section>
  </div>
  <script src="logic/booleanRules.js"></script><script src="data/demoData.js"></script><script src="services/storage.js"></script><script src="script.js"></script><script src="fix-navigation.js"></script><script src="real-map.js"></script>
</body></html>
